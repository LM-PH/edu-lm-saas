name: Supabase Keep Alive (Cada 3 Días)

on:
  schedule:
    # Corre automáticamente cada 3 días a las 12:00 UTC
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer ping de salud y consulta a la Base de Datos
        run: |
          echo "🤖 Robot GitHub: Iniciando verificación de actividad..."
          
          # 1. Ping Auth Endpoint
          HTTP_AUTH=$(curl -s -o /dev/null -w "%{http_code}" https://eexgjaydpuioncenlsmv.supabase.co/auth/v1/health)
          echo "Status Auth: $HTTP_AUTH"
          
          # 2. Consulta REST a la tabla de planteles para mantener activa la base de datos
          HTTP_DB=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVleGdqYXlkcHVpb25jZW5sc212Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NTM0MDAsImV4cCI6MjEwMDQyOTQwMH0.vrJGn_Bg04OBBntL-w21-I27XuvO61HcUNrphMYYSlY" -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVleGdqYXlkcHVpb25jZW5sc212Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NTM0MDAsImV4cCI6MjEwMDQyOTQwMH0.vrJGn_Bg04OBBntL-w21-I27XuvO61HcUNrphMYYSlY" https://eexgjaydpuioncenlsmv.supabase.co/rest/v1/planteles?select=id&limit=1)
          echo "Status DB REST: $HTTP_DB"
          
          echo "✅ Conexión completada exitosamente. Supabase mantendrá la base de datos activa."
